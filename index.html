<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Truco</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4efe6;--fg:#1d1b17;--pan:#fff;--mut:#6b655a;--acc:#b3261e;--felt:#1f6b45;--ln:#d8d0c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--fg:#f1ece2;--pan:#201d18;--mut:#a39b8b;--acc:#ef6a5f;--felt:#14503a;--ln:#38332a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--fg:#f1ece2;--pan:#201d18;--mut:#a39b8b;--acc:#ef6a5f;--felt:#14503a;--ln:#38332a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.opt{background:var(--pan);border:2px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0}
.opt.on{border-color:var(--acc)}
.opt label{font-weight:700;display:flex;gap:8px;align-items:center;cursor:pointer}
details{margin-top:6px;color:var(--mut);font-size:14px}summary{cursor:pointer;color:var(--acc)}
details p{margin:6px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.s{background:var(--pan);color:var(--fg);border:1px solid var(--ln)}
input[type=text]{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--ln);background:var(--pan);color:var(--fg);width:150px;text-transform:lowercase}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc{text-align:center;font-size:18px;margin:6px 0}
.felt{background:var(--felt);border-radius:16px;padding:12px 8px;color:#fff}
.row{display:flex;justify-content:center;gap:8px;min-height:90px}
.tbl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;justify-items:center;margin:8px 0}
.slot{display:flex;flex-direction:column;gap:6px;align-items:center}
.c{width:58px;height:84px;border-radius:8px;background:#fffdf6;border:1px solid #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:21px;line-height:1.1;user-select:none}
.c small{font-size:22px}.c.b{background:repeating-linear-gradient(45deg,#8c2a2a,#8c2a2a 6px,#6e1f1f 6px,#6e1f1f 12px)}
.c.e{background:#ffffff14;border:1px dashed #fff5}
.c.h{cursor:pointer;transition:transform .12s}.c.h:hover{transform:translateY(-8px)}
.msg{background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;margin:10px 0;min-height:40px}
.log{font-size:13px;color:var(--mut);margin:6px 0}
.cov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:9}
.cov h2{margin:0 0 12px}
</style></head><body><main id="app"></main>
<script>
const SU=['🗡️','🌿','🪙','🍷'],COL=['#1d4e89','#2e7d32','#b8860b','#b3261e'];
const CFG={
arg:{n:'Truco Argentino',tgt:15,lad:[1,2,3,4],nm:['','Truco','Retruco','Vale cuatro'],env:1,flor:0},
uy:{n:'Truco Uruguayo',tgt:30,lad:[1,2,3,4],nm:['','Truco','Retruco','Vale cuatro'],env:1,flor:1},
br:{n:'Truco Brasileño (Mineiro)',tgt:12,lad:[1,3,6,9,12],nm:['','Truco','Seis','Nove','Doze'],env:0,flor:0}};
const TUT={
arg:`<p><b>Objetivo:</b> llegar a 15 puntos. Mazo español de 40 cartas (sin 8 ni 9). Cada mano se reparten 3 cartas y se juegan hasta 3 bazas; gana la mano quien gane 2. Si se empata (parda) la primera baza, decide la segunda.</p><p><b>Orden de las cartas (mayor a menor):</b> 1🗡️, 1🌿, 7🗡️, 7🪙, los 3, los 2, 1🍷 y 1🪙, 12, 11, 10, 7🍷 y 7🌿, 6, 5, 4.</p><p><b>Truco:</b> Truco (2 pts) → Retruco (3) → Vale cuatro (4). El rival puede querer, subir o no querer (el que cantó suma los puntos anteriores).</p><p><b>Envido</b> (solo en la 1.ª baza): Envido 2 pts, Real Envido 3, Falta Envido (lo que falta para ganar). Tanto = 20 + las dos cartas del mismo palo (10, 11 y 12 valen 0); sin palo repetido, vale la carta más alta. Gana el tanto mayor; si empatan, el mano. En esta versión no hay flor.</p>`,
uy:`<p><b>Objetivo:</b> llegar a 30 puntos. Mismo mazo y mismo orden de cartas que el argentino (1🗡️, 1🌿, 7🗡️, 7🪙, 3, 2, 1🍷/1🪙, 12, 11, 10, 7🍷/7🌿, 6, 5, 4).</p><p><b>Truco:</b> Truco (2) → Retruco (3) → Vale cuatro (4), con las mismas reglas de querer / no querer / subir. Gana la mano quien gane 2 de 3 bazas.</p><p><b>Envido:</b> Envido (2), Real Envido (3) y Falta Envido en la primera baza.</p><p><b>Flor:</b> si recibís 3 cartas del mismo palo ganás 3 puntos automáticamente (si ambos tienen flor, el mayor gana 6) y ese turno no hay envido.</p>`,
br:`<p><b>Objetivo:</b> llegar a 12 puntos. Mazo de 40 cartas (A–7, Q=10, J=11, K=12). No hay envido. Gana la mano quien gane 2 de 3 bazas; la primera empatada la define la segunda.</p><p><b>Manilhas fijas (mayor a menor):</b> 4🌿 (zap), 7🍷, 1🗡️, 7🪙; luego los 3, los 2, los ases restantes, K, J, Q, los 7 restantes, 6, 5 y los 4 restantes.</p><p><b>Apuestas:</b> la mano vale 1. Truco → 3, Seis → 6, Nove → 9, Doze → 12. El rival puede aceitar (aceptar), aumentar o correr (rendirse: el que cantó suma lo que valía antes). Esta es la versión Mineiro; la Paulista usa una carta «vira».</p>`};
const $=s=>document.querySelector(s);
let G=null,mode='',sel='arg',room=null,shownFor=-1,tm=0,status='';
const cfg=()=>CFG[G.v],nm=s=>G.nm[s],V=c=>c.n>9?0:c.n;
function str(c,v){const{n,s}=c;if(v=='br'){if(n==4&&s==1)return 14;if(n==7&&s==3)return 13;if(n==1&&s==0)return 12;if(n==7&&s==2)return 11}else{if(n==1&&s==0)return 14;if(n==1&&s==1)return 13;if(n==7&&s==0)return 12;if(n==7&&s==2)return 11}
if(n==3)return 10;if(n==2)return 9;if(n==1)return 8;if(n==12)return 7;if(n==11)return 6;if(n==10)return 5;if(n==7)return 4;return n==6?3:n==5?2:1}
function ev(h){let b=0;for(const a of h)for(const c of h)if(a!==c&&a.s===c.s)b=Math.max(b,20+V(a)+V(c));for(const a of h)b=Math.max(b,V(a));return b}
const log=t=>{G.log.push(t);if(G.log.length>6)G.log.shift()};
function add(w,p){G.sc[w]+=p;if(G.sc[w]>=cfg().tgt){G.sc[w]=cfg().tgt;G.over=true;G.win=w;log(nm(w)+' gana la partida')}}
function deal(){const d=[];for(let s=0;s<4;s++)for(const n of[1,2,3,4,5,6,7,10,11,12])d.push({n,s});
for(let i=39;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
G.h=[d.slice(0,3),d.slice(3,6)];G.o=[[...G.h[0]],[...G.h[1]]];G.tb=[[],[]];G.rd=0;G.r=[];G.turn=G.mano;G.ti=0;G.rz=-1;G.pend=null;G.ed=false;G.ph='play';
log('— Nueva mano. Mano: '+nm(G.mano));
if(cfg().flor){const f=G.o.map(h=>h.every(c=>c.s==h[0].s)?20+h.reduce((a,c)=>a+V(c),0):-1);
if(f[0]>=0||f[1]>=0){G.ed=true;let w,p;if(f[0]>=0&&f[1]>=0){w=f[0]>f[1]||(f[0]==f[1]&&G.mano==0)?0:1;p=6}else{w=f[0]>=0?0:1;p=3}log(nm(w)+' tiene flor (+'+p+')');add(w,p)}}}
function newGame(v,m){G={v,sc:[0,0],mano:0,over:false,log:[],nm:m=='cpu'?['Vos','CPU']:['Jugador 1','Jugador 2']};deal()}
const actor=()=>G.pend?1-G.pend.from:G.turn;
const canT=s=>G.ti+1<cfg().lad.length&&(G.rz<0||G.rz==s)&&!G.pend;
const canE=s=>cfg().env&&!G.ed&&G.rd==0&&G.ti==0&&G.tb[s][0]===undefined&&!G.pend;
function decide(){const r=G.r,w=[0,0];r.forEach(x=>x>=0&&w[x]++);if(w[0]>1)return 0;if(w[1]>1)return 1;
if(r.length>1){if(r[0]<0&&r[1]>=0)return r[1];if(r[0]>=0&&r[1]<0)return r[0]}
if(r.length>2)return r[0]>=0?r[0]:r[2]>=0?r[2]:G.mano;return-1}
function endHand(w,p){log(nm(w)+' gana la mano (+'+p+')');add(w,p);G.ph='end'}
function doAct(s,a){if(!G||G.over||!a)return;
if(a.t=='next'){if(G.ph=='end'){G.mano=1-G.mano;deal()}return}
if(G.ph!='play'||s!=actor())return;const C=cfg(),p=G.pend;
if(p){if(p.k=='t'){
if(a.t=='q'){G.ti=p.p;G.rz=s;G.pend=null;log(nm(s)+': ¡Quiero!')}
else if(a.t=='n'){log(nm(s)+': No quiero');G.pend=null;return endHand(p.from,C.lad[G.ti])}
else if(a.t=='t'&&p.p+1<C.lad.length){G.ti=p.p;G.pend={k:'t',from:s,p:p.p+1};log(nm(s)+': ¡'+C.nm[p.p+1]+'!')}}
else{if(a.t=='q'){const e=G.o.map(ev),pts=p.e=='e'?2:p.e=='r'?3:Math.max(1,C.tgt-Math.max(...G.sc)),w=e[0]>e[1]||(e[0]==e[1]&&G.mano==0)?0:1;
log('Envido: '+nm(0)+' '+e[0]+', '+nm(1)+' '+e[1]+' → +'+pts+' '+nm(w));G.ed=true;G.pend=null;add(w,pts)}
else if(a.t=='n'){log(nm(s)+': No quiero (+1 '+nm(p.from)+')');G.ed=true;G.pend=null;add(p.from,1)}}return}
if(a.t=='p'){const c=G.h[s][a.i];if(!c)return;G.h[s].splice(a.i,1);G.tb[s][G.rd]=c;
if(G.tb[1-s][G.rd]){const x=str(G.tb[0][G.rd],G.v),y=str(G.tb[1][G.rd],G.v),w=x>y?0:y>x?1:-1;G.r.push(w);const d=decide();
log('Baza '+(G.rd+1)+': '+(w<0?'parda':nm(w)));if(d>=0)return endHand(d,C.lad[G.ti]);G.rd++;G.turn=w>=0?w:G.mano}else G.turn=1-s}
else if(a.t=='t'&&canT(s)){G.pend={k:'t',from:s,p:G.ti+1};log(nm(s)+': ¡'+C.nm[G.ti+1]+'!')}
else if(/^[erf]$/.test(a.e)&&a.t=='e'&&canE(s)){G.pend={k:'e',from:s,e:a.e};log(nm(s)+': ¡'+{e:'Envido',r:'Real Envido',f:'Falta Envido'}[a.e]+'!')}
else if(a.t=='m'){log(nm(s)+' se va al mazo');endHand(1-s,C.lad[G.ti])}}
function cpuMove(){const s=1,h=G.h[s],p=G.pend,C=cfg(),R=Math.random,S=h.map(c=>str(c,G.v)),best=Math.max(0,...S),avg=S.length?S.reduce((a,b)=>a+b)/S.length:0;
const st=(best+avg)/2+G.r.filter(x=>x==1).length*2.5-G.r.filter(x=>x==0).length*2,e=ev(G.o[1]);
if(p){if(p.k=='t'){if(p.p+1<C.lad.length&&st>10.5&&R()<.4)return{t:'t'};return st+R()*4-2>5.5+p.p*.9?{t:'q'}:{t:'n'}}
return e+R()*3>(p.e=='f'?32:p.e=='r'?29:26)?{t:'q'}:{t:'n'}}
if(canE(s)){if(e>=27&&R()<.6)return{t:'e',e:e>=31&&R()<.4?'r':'e'};if(R()<.06)return{t:'e',e:'e'}}
if(canT(s)&&((st>9&&R()<.3)||R()<.04))return{t:'t'};
const idx=S.map((x,i)=>i).sort((a,b)=>S[a]-S[b]);
if(G.tb[0][G.rd]===undefined)return{t:'p',i:G.rd==0&&avg<8?idx[idx.length>>1]:idx[idx.length-1]};
const x=str(G.tb[0][G.rd],G.v),w=idx.find(i=>S[i]>x);return{t:'p',i:w!==undefined?w:idx[0]}}
function bc(){if(mode=='host'&&room&&G)room.emit('state',{...G,o:0,h:[G.h[0].map(()=>({})),G.h[1]]}).catch(()=>{})}
const vs=()=>mode=='guest'?1:mode=='hot'?(G.ph=='play'?actor():0):0;
function send(a){if(mode=='guest'){room.emit('act',{a}).catch(()=>{});return}doAct(vs(),a);render();bc()}
function card(c,i,click){return `<div class="c${click?' h':''}" ${click?`onclick="send({t:'p',i:${i}})"`:''} style="color:${COL[c.s]}"><span>${c.n}</span><small>${SU[c.s]}</small></div>`}
const back=n=>'<div class="c b"></div>'.repeat(n);
function render(){const A=$('#app');if(!G){menu(A);return}
const me=vs(),op=1-me,C=cfg(),ac=actor(),mine=G.ph=='play'&&ac==me;
if(mode=='hot'){if(G.ph=='end')shownFor=-1;if(G.ph=='play'&&!G.over&&shownFor!=me){A.innerHTML=`<div class="cov"><h2>Turno de ${nm(me)}</h2><p>Pasale el dispositivo y que el otro jugador no mire.</p><button onclick="shownFor=${me};render()">Listo, soy ${nm(me)}</button></div>`;return}}
let t='';for(let i=0;i<3;i++){const o=G.tb[op][i],m=G.tb[me][i];t+=`<div class="slot">${o?card(o):'<div class="c e"></div>'}${m?card(m):'<div class="c e"></div>'}</div>`}
let b='';
if(G.over)b=`<b>${G.win==me?'¡Ganaste la partida!':'Perdiste la partida'}</b><br><button onclick="quit()">Volver al menú</button>`;
else if(G.ph=='end')b=`<button onclick="send({t:'next'})">Siguiente mano</button>`;
else if(G.pend&&ac==me){const p=G.pend;
if(p.k=='t')b=`<b>${nm(p.from)}: ¡${C.nm[p.p]}!</b><br><button onclick="send({t:'q'})">${G.v=='br'?'¡Aceito!':'¡Quiero!'}</button><button class="s" onclick="send({t:'n'})">${G.v=='br'?'Correr':'No quiero'}</button>`+(p.p+1<C.lad.length?`<button class="s" onclick="send({t:'t'})">${C.nm[p.p+1]}</button>`:'');
else b=`<b>${nm(p.from)}: ¡${{e:'Envido',r:'Real Envido',f:'Falta Envido'}[p.e]}!</b><br><button onclick="send({t:'q'})">¡Quiero!</button><button class="s" onclick="send({t:'n'})">No quiero</button>`}
else if(G.pend)b='Esperando respuesta…';
else if(mine){if(canT(me))b+=`<button onclick="send({t:'t'})">¡${C.nm[G.ti+1]}!</button>`;
if(canE(me))b+=`<button class="s" onclick="send({t:'e',e:'e'})">Envido</button><button class="s" onclick="send({t:'e',e:'r'})">Real envido</button><button class="s" onclick="send({t:'e',e:'f'})">Falta envido</button>`;
b+=`<button class="s" onclick="send({t:'m'})">${G.v=='br'?'Correr':'Al mazo'}</button>`}
else b='Turno de '+nm(ac)+'…';
A.innerHTML=`<div class="top"><b>${C.n} · a ${C.tgt}</b><button class="s" onclick="quit()">Salir</button></div>
<div class="sc">${mode=='cpu'||mode=='host'||mode=='guest'?'Vos':nm(me)} <b>${G.sc[me]}</b> · ${nm(op)} <b>${G.sc[op]}</b></div>
<div class="felt"><div class="row">${back(G.h[op].length)}</div><div class="tbl">${t}</div>
<div class="row">${G.h[me].map((c,i)=>card(c,i,mine&&!G.pend)).join('')}</div></div>
<div class="msg">${b}</div><div class="log">${G.log.slice(-5).reverse().map(x=>`<div>${esc(x)}</div>`).join('')}</div>`;
clearTimeout(tm);if(mode=='cpu'&&!G.over&&G.ph=='play'&&actor()==1)tm=setTimeout(()=>{doAct(1,cpuMove());render()},950)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function menu(A){A.innerHTML=`<h1>🃏 Truco</h1><p class="sub">Elegí la variante, leé cómo se juega y elegí cómo querés jugar.</p>`+
Object.keys(CFG).map(k=>`<div class="opt ${sel==k?'on':''}"><label><input type="radio" name="v" ${sel==k?'checked':''} onchange="sel='${k}';menu($('#app'))"> ${CFG[k].n}</label><details><summary>Cómo se juega</summary>${TUT[k]}</details></div>`).join('')+
`<p><button onclick="start('cpu')">🤖 Jugar contra la CPU</button><button onclick="start('hot')">👥 Dos jugadores, mismo dispositivo</button></p>
<div class="opt"><b>🌐 Online</b><p class="sub" style="margin:4px 0 8px">Uno crea la sala y le pasa el código al otro, que abre esta misma página y lo ingresa.</p>
<button onclick="mk()">Crear sala</button> <input id="cd" type="text" placeholder="código" maxlength="12"> <button class="s" onclick="jn()">Unirme</button><div id="st" class="sub">${esc(status)}</div></div>`}
function start(m){mode=m;shownFor=-1;newGame(sel,m);render()}
function quit(){clearTimeout(tm);if(room){room.leave().catch(()=>{});room=null}G=null;mode='';status='';render()}
function wsRoom(name){return new Promise((res,rej)=>{const w=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host),h={};
const r={emit:(t,d)=>{if(w.readyState==1)w.send(JSON.stringify({t,d}));return Promise.resolve()},on:(t,f)=>{(h[t]=h[t]||[]).push(f)},leave:()=>{w.close();return Promise.resolve()}};
w.onopen=()=>w.send(JSON.stringify({j:name}));w.onerror=()=>rej('error');
w.onmessage=e=>{const m=JSON.parse(e.data);if(m.ok)res(r);else if(m.err)rej(m.err);else(h[m.topic]||[]).forEach(f=>f({data:m.data,isMe:false}))}})}
async function conn(code,host){code=code.toLowerCase().replace(/[^a-z0-9]/g,'');if(code.length<3){status='Código inválido';return render()}
const R={join:wsRoom};if(!R){status='El modo online no está disponible en este visor.';return render()}
try{room=await R.join('truco-'+code)}catch(e){status='No se pudo conectar.';return render()}
mode=host?'host':'guest';
if(host){status='Sala «'+code+'» creada. Esperando al rival…';render();
room.on('hello',m=>{if(m.isMe)return;if(!G)newGame(sel,'on');bc();render()});
room.on('act',m=>{if(m.isMe||!G||!m.data)return;doAct(1,m.data.a);render();bc()})}
else{status='Conectando a «'+code+'»…';render();room.on('state',m=>{if(m.isMe||!m.data)return;G=m.data;render()});
const iv=setInterval(()=>{if(G||!room)return clearInterval(iv);room.emit('hello',{}).catch(()=>{})},1500);room.emit('hello',{}).catch(()=>{})}}
function mk(){const c=Math.random().toString(36).slice(2,7);conn(c,true)}
function jn(){conn($('#cd').value,false)}
render();
</script></body></html>
